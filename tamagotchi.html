<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Tamagotchi page">
  <title>Tamagotchi</title>
  <link rel="icon" type="image/x-icon" href="bilder/favicon.ico">
  <link rel="stylesheet" href="tamagotchi.css">
  <script src="tamagotchi-image-popup.js" defer></script>
</head>
<body class="tamagotchi-page">
  <div class="scanlines" aria-hidden="true"></div>
  <a class="skip-link" href="#content">Skip to content</a>
  <a class="homepage-button" href="index.html">← homepage</a>

  <main class="tamagotchi-device" aria-label="Tamagotchi project window">
    <div class="tamagotchi-screen">
      <section class="luno-content" id="content">
        <iframe
          class="luno-frame"
          name="window-content"
          src="tamagotchi-home.html"
          title="Tamagotchi window content"
        ></iframe>
      </section>
    </div>

    <img class="tamagotchi-frame" src="bilder/tamagotchi.PNG" alt="" aria-hidden="true">
    <a class="device-hotspot device-hotspot--home" href="tamagotchi-home.html" target="window-content" aria-label="Home"></a>
    <a class="device-hotspot device-hotspot--tutorial" href="tamagotchi-tutorial.html" target="window-content" aria-label="Tutorial"></a>
    <a class="device-hotspot device-hotspot--credits" href="tamagotchi-credit.html" target="window-content" aria-label="Credits"></a>
    <span class="device-label device-label--home">home</span>
    <span class="device-label device-label--tutorial">tutorial</span>
    <span class="device-label device-label--credits">credits</span>
  </main>
</body>
</html>
